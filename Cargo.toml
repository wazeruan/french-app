[package]
name = "french-app"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
